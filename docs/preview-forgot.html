<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>@withwiz/auth-ui — ForgotPasswordPage preview</title>
<link rel="stylesheet" href="../src/styles/auth.css" />
<style>
  /* Page-level reset for this static demo only — not part of the package. */
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
</style>
</head>
<body>
<!-- <ForgotPasswordPage />  (locale default 'ko') -->
<div class="wiz-auth-page">
  <div class="wiz-auth-content">
    <div class="wiz-auth-body">
      <div class="wiz-auth-slot">

        <!-- ForgotPasswordForm — title/subtitle are direct children of .wiz-auth-form
             (no .wiz-auth-header wrapper), matched by the `.wiz-auth-form > .wiz-auth-title` /
             `.wiz-auth-form > .wiz-auth-subtitle` rules in auth.css. -->
        <div class="wiz-auth-form">
          <h1 class="wiz-auth-title">비밀번호 찾기</h1>
          <p class="wiz-auth-subtitle">가입한 이메일을 입력하세요</p>
          <form class="wiz-auth-fields" onsubmit="return false">
            <div class="wiz-auth-field">
              <label for="wiz-forgot-email" class="wiz-auth-label">이메일</label>
              <input id="wiz-forgot-email" type="email" placeholder="name@example.com" required class="wiz-auth-input" />
            </div>
            <button type="submit" class="wiz-auth-submit">재설정 링크 보내기</button>
          </form>
          <p class="wiz-auth-footer">
            <a href="/login" class="wiz-auth-link">로그인으로 돌아가기</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <div class="wiz-auth-side-panel">
    <div class="wiz-auth-pattern">
      <svg width="100%" height="100%"><defs><pattern id="wiz-triangles" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse"><polygon points="30,0 60,52 0,52" fill="#6366f1" fill-opacity="0.3" /></pattern></defs><rect width="100%" height="100%" fill="url(#wiz-triangles)" /></svg>
    </div>
  </div>
</div>
</body>
</html>
