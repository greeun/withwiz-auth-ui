<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>@withwiz/auth-ui — ResetPasswordPage preview</title>
<link rel="stylesheet" href="../src/styles/auth.css" />
<style>
  /* Page-level reset for this static demo only — not part of the package. */
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
</style>
</head>
<body>
<!-- <ResetPasswordPage token="..." />  (locale default 'ko') -->
<div class="wiz-auth-page">
  <div class="wiz-auth-content">
    <div class="wiz-auth-body">
      <div class="wiz-auth-slot">

        <!-- ResetPasswordForm — title/subtitle are direct children of .wiz-auth-form,
             same as ForgotPasswordForm. -->
        <div class="wiz-auth-form">
          <h1 class="wiz-auth-title">비밀번호 재설정</h1>
          <p class="wiz-auth-subtitle">새 비밀번호를 입력하세요</p>
          <form class="wiz-auth-fields" onsubmit="return false">
            <div class="wiz-auth-field">
              <label for="wiz-reset-password" class="wiz-auth-label">새 비밀번호</label>
              <input id="wiz-reset-password" type="password" placeholder="8자 이상 입력하세요" class="wiz-auth-input" />
            </div>
            <div class="wiz-auth-field">
              <label for="wiz-reset-confirm" class="wiz-auth-label">비밀번호 확인</label>
              <input id="wiz-reset-confirm" type="password" placeholder="비밀번호를 다시 입력하세요" class="wiz-auth-input" />
            </div>
            <button type="submit" class="wiz-auth-submit">비밀번호 변경</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="wiz-auth-side-panel">
    <div class="wiz-auth-pattern">
      <svg width="100%" height="100%"><defs><pattern id="wiz-triangles" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse"><polygon points="30,0 60,52 0,52" fill="#6366f1" fill-opacity="0.3" /></pattern></defs><rect width="100%" height="100%" fill="url(#wiz-triangles)" /></svg>
    </div>
  </div>
</div>
</body>
</html>
